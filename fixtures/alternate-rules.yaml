version: 1
idPattern: "^[A-Z]+-[0-9]+$"
discovery:
  documents: ["fixtures/none/**/*.md"]
  manualCases: []
  sources: []
documents:
  kinds:
    module:
      description: module
      parent: { required: false, targetKinds: [module] }
  displayOrder:
    module: [MOD-2, MOD-1]
case:
  fields:
    belongsTo: { required: true, placement: classification, type: reference, targetKinds: [module] }
    role:
      required: true
      placement: classification
      type: enum
      values:
        contract: { description: contract }
    impact:
      required: true
      placement: classification
      type: integer-enum
      values:
        10: { description: low }
        20: { description: high }
